# GridRoute v2: local stack.
#   docker compose up -d redis                       # just Redis (tests, local dev)
#   docker compose up -d --build --scale ingest=2 --scale matcher=2
#                                                    # full M1 loop: gateway :8000, workers, 5k drivers, riders
# Prometheus :9090 and Grafana :3001 (dashboard "GridRoute · Dispatch") come up with the stack.

x-app: &app
  image: gridroute-app
  pull_policy: never          # local image, built once by the gateway service below
  environment:
    REDIS_URL: redis://redis:6379/0
    METRICS_PORT: "9100"         # workers serve /metrics here (Prometheus scrapes it in M2)
  depends_on:
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  gateway:
    <<: *app
    build: .
    command: ["uvicorn", "gateway.app:app", "--host", "0.0.0.0", "--port", "8000", "--log-level", "warning"]
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 3s
      timeout: 3s
      retries: 10

  ingest:
    <<: *app
    command: ["python", "-m", "workers.ingest"]

  matcher:
    <<: *app
    command: ["python", "-m", "workers.matcher"]
    environment:
      REDIS_URL: redis://redis:6379/0
      METRICS_PORT: "9100"
      OSRM_URL: http://osrm:5000
      MATCH_POLICY: ${MATCH_POLICY:-batch-eta}   # live demo runs the best measured policy (R3); replays set their own
    volumes:
      - ./models:/app/models:ro      # model registry (models/eta/vN); the Redis pointer picks the version

  reaper:
    <<: *app
    command: ["python", "-m", "workers.reaper"]

  aggregator:
    <<: *app
    command: ["python", "-m", "workers.aggregator"]

  forecaster:
    <<: *app
    command: ["python", "-m", "workers.forecaster"]
    volumes:
      - ./models:/app/models:ro      # models/demand/vN; model:demand:current picks the version

  repositioner:
    <<: *app
    command: ["python", "-m", "workers.repositioner"]   # idle unless config:reposition=1 (replay --reposition)

  runner:                            # policy lab: runs the replays POST /runs queues, one at a time
    <<: *app
    command: ["python", "-m", "workers.runner"]
    environment:
      REDIS_URL: redis://redis:6379/0
      METRICS_PORT: "9100"
      GRIDROUTE_DATA_DIR: /data
      OSRM_URL: http://osrm:5000
      GATEWAY_HTTP: http://gateway:8000
      GATEWAY_WS: ws://gateway:8000/ws/driver
    volumes:
      # Trips (clean/), demand counts (features/) and recorded runs (runs/, lab/). Set GRIDROUTE_DATA_DIR in
      # .env or the shell to the folder `python -m data.download` filled; defaults to ./data in the repo.
      - ${GRIDROUTE_DATA_DIR:-./data}:/data
    depends_on:
      gateway:
        condition: service_healthy
      osrm:
        condition: service_started

  sim:
    <<: *app
    command: ["python", "-m", "sim.live", "--drivers", "${SIM_DRIVERS:-5000}"]
    environment:
      REDIS_URL: redis://redis:6379/0
      GATEWAY_WS: ws://gateway:8000/ws/driver
      OSRM_URL: http://osrm:5000
    depends_on:
      gateway:
        condition: service_healthy
      osrm:
        condition: service_started

  riders:
    <<: *app
    command: ["python", "-m", "sim.riders", "--rate", "${RIDE_RATE:-3}"]   # ~58% fleet utilisation with real-street trip times
    environment:
      GATEWAY_HTTP: http://gateway:8000
      REDIS_URL: redis://redis:6379/0
    depends_on:
      gateway:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    # Live state only (spec §9): no AOF, no RDB snapshots; state rebuilds from pings within ~4 s.
    command: ["redis-server", "--appendonly", "no", "--save", "", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  # ---- observability: Prometheus pulls /metrics, Grafana reads Prometheus -------
  prometheus:
    image: prom/prometheus:v3.15.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:13.0.2
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"          # local demo: read-only viewing without a login
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-gridroute}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/gridroute.json
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"                              # :3000 is the ops dashboard
    depends_on:
      - prometheus
    restart: unless-stopped

  # ---- benchmarks (profile "bench"): H3 index vs Redis GEO vs PostGIS (spec C5) ----
  postgis:
    profiles: ["bench"]
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: bench
      POSTGRES_PASSWORD: bench
      POSTGRES_DB: bench
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "bench"]
      interval: 2s
      retries: 30

  bench-api:
    profiles: ["bench"]
    image: gridroute-app
    pull_policy: never
    command: ["uvicorn", "bench.api:app", "--host", "0.0.0.0", "--port", "8100", "--workers", "4", "--log-level", "warning"]
    environment:
      BENCH_REDIS_URL: redis://redis:6379
      BENCH_PG_DSN: postgresql://bench:bench@postgis:5432/bench
    ports:
      - "8100:8100"
    depends_on:
      postgis:
        condition: service_healthy
      redis:
        condition: service_healthy

  k6:
    profiles: ["bench"]
    image: grafana/k6:2.3.0
    volumes:
      - ./bench/k6:/scripts
    environment:
      BASE: http://bench-api:8100

  # ---- ML training on the GPU (profile "ml"): LightGBM built with CUDA ---------
  #   docker compose --profile ml run --rm train python3 -m ml.eta_train
  train:
    profiles: ["ml"]
    build:
      context: ml
      dockerfile: Dockerfile.gpu
    image: gridroute-train-gpu
    volumes:
      - .:/app
      - ${GRIDROUTE_DATA_DIR:-./data}:/data
    environment:
      GRIDROUTE_DATA_DIR: /data
      PYTHONPATH: /app
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ---- OSRM: road routing for the simulator, replay, features and (M3) the matcher ----
  # First start downloads the NYC extract and builds the graph once (~1-2 min), then serves on :5001.
  # Data lives in a named volume, not the repo folder: the processed graph is several GB.
  osrm-download:
    image: curlimages/curl:8.10.1
    user: root
    volumes:
      - osrm-data:/data
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        if [ -f /data/region.osm.pbf ]; then echo "pbf present, skipping download"; exit 0; fi
        curl -fL --retry 3 -o /data/region.osm.pbf.part "$${OSRM_PBF_URL}"
        mv /data/region.osm.pbf.part /data/region.osm.pbf
    environment:
      # BBBike's NYC-area extract (lng -74.36..-73.67, lat 40.48..40.96) covers the whole service bbox at a
      # third of the NY-state file's size, so the graph builds comfortably inside Docker's 8 GB.
      OSRM_PBF_URL: ${OSRM_PBF_URL:-https://download.bbbike.org/osm/bbbike/NewYork/NewYork.osm.pbf}

  osrm-prep:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    volumes:
      - osrm-data:/data
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        if [ -f /data/region.osrm.hsgr ]; then echo "graph already built, skipping"; exit 0; fi
        [ -f /data/region.osrm.ebg ] || osrm-extract -p /opt/car.lua /data/region.osm.pbf
        # Contraction Hierarchies: the matcher's many-to-many /table is ~10x faster than on MLD
        # (160 drivers x 20 pickups: 0.8-1.1 s on MLD, measured)
        osrm-contract /data/region.osrm
    depends_on:
      osrm-download:
        condition: service_completed_successfully

  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    command: ["osrm-routed", "--algorithm", "ch", "--max-table-size", "10000", "/data/region.osrm"]
    ports:
      - "5001:5000"   # host 5000 is often taken (AirPlay / other dev servers)
    volumes:
      - osrm-data:/data
    depends_on:
      osrm-prep:
        condition: service_completed_successfully

volumes:
  osrm-data:
